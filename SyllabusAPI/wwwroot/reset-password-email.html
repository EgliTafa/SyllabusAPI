<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; padding: 0;">
    <div style="max-width: 480px; margin: 40px auto; border: 1px solid #eee; border-radius: 8px; overflow: hidden; background: #fff;">
        <div style="background: #003366; padding: 24px 0; text-align: center;">
            <img src="{{logoUrl}}" alt="University Logo" style="height: 60px;"/>
        </div>
        <div style="padding: 32px 24px 24px 24px;">
            <h2 style="color: #003366;">Reset Your Password</h2>
            <p style="font-size: 16px; color: #222;">We received a request to reset your password. Click the button below to set a new password:</p>
            <div style="text-align: center; margin: 32px 0;">
                <a href="{{resetLink}}" style="background: #007bff; color: #fff; padding: 14px 32px; border-radius: 6px; text-decoration: none; font-size: 18px;">Reset Password</a>
            </div>
            <p style="font-size: 14px; color: #888;">If you did not request a password reset, you can safely ignore this email.</p>
        </div>
    </div>
</body>
</html>
